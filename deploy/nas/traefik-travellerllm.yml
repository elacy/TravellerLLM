# Standalone Traefik v3 dynamic route for https://travellerllm.i.lacy.ie
# Uploaded to /mnt/bulk/hermes/traefik/dynamic/travellerllm.yml on nas.lacy.ie
# Uses the shared `authentik-forward` middleware (forward-auth.yml) and `auth` service (hosts.yml).
http:
  routers:
    travellerllm-outpost:
      rule: "Host(`travellerllm.i.lacy.ie`) && PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints:
        - websecure
      service: auth
      priority: 15
      tls:
        certResolver: route53
        domains:
          - main: "*.i.lacy.ie"
            sans:
              - i.lacy.ie

    travellerllm:
      rule: "Host(`travellerllm.i.lacy.ie`)"
      entryPoints:
        - websecure
      service: travellerllm
      middlewares:
        - authentik-forward
        - travellerllm-proxy-secret
      tls:
        certResolver: route53
        domains:
          - main: "*.i.lacy.ie"
            sans:
              - i.lacy.ie

  middlewares:
    travellerllm-proxy-secret:
      headers:
        customRequestHeaders:
          X-Auth-Proxy-Secret: "<AUTH_PROXY_SECRET>"

  services:
    travellerllm:
      loadBalancer:
        servers:
          - url: "http://10.233.12.3:3080"
