# Drop into /mnt/bulk/hermes/traefik/dynamic/travellerllm.yml on nas.lacy.ie
# Replace <AUTH_PROXY_SECRET> with the same random secret set on the travellerllm app
# (or remove the travellerllm-proxy-secret middleware if AUTH_PROXY_SECRET is unset).
# Ensure an Authentik Proxy Provider + Application for https://travellerllm.i.lacy.ie
# is attached to the embedded Authentik outpost on https://auth.i.lacy.ie.

http:
  routers:
    travellerllm:
      rule: "Host(`travellerllm.i.lacy.ie`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-travellerllm@file
        - travellerllm-proxy-secret@file
      service: travellerllm

  middlewares:
    authentik-travellerllm:
      forwardAuth:
        address: "http://10.233.12.5:9300/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    travellerllm-proxy-secret:
      headers:
        customRequestHeaders:
          X-Auth-Proxy-Secret: "<AUTH_PROXY_SECRET>"

  services:
    travellerllm:
      loadBalancer:
        servers:
          - url: "http://10.233.12.5:3080"
