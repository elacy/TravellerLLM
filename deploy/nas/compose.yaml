services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travellerllm
      POSTGRES_USER: traveller
      POSTGRES_PASSWORD: ${TRAVELLERLLM_PG_PASSWORD:?set TRAVELLERLLM_PG_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveller -d travellerllm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - type: bind
        source: /mnt/bulk/hermes/travellerllm/postgres
        target: /var/lib/postgresql/data

  travellerllm:
    image: ghcr.io/elacy/travellerllm:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Los_Angeles
      PORT: "3080"
      FRONTEND_DIR: /app/frontend/dist
      DATA_PACKS_DIR: /data/packs
      DATABASE_URL: postgresql://traveller:${TRAVELLERLLM_PG_PASSWORD:?set TRAVELLERLLM_PG_PASSWORD}@postgres:5432/travellerllm
      AUTH_MODE: authentik_proxy
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      AUTH_LOGIN_URL: https://auth.i.lacy.ie
      AUTH_LOGOUT_URL: /outpost.goauthentik.io/sign_out
      LITELLM_BASE_URL: http://10.233.12.5:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY}
      REFEREE_MODEL: ${REFEREE_MODEL:-deepseek/deepseek-chat}
      WORKER_MODEL: ${WORKER_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      SUMMARIZER_FALLBACK_MODEL: ${SUMMARIZER_FALLBACK_MODEL:-z-ai/glm-5.3-flash}
      HINDSIGHT_BASE_URL: http://10.233.12.5:8888
      HINDSIGHT_ENABLED: "true"
    ports:
      - published: 3080
        target: 3080
    volumes:
      - type: bind
        source: /mnt/bulk/hermes/travellerllm/packs
        target: /data/packs
        read_only: true
    labels:
      - "homepage.group=Games"
      - "homepage.name=TravellerLLM"
      - "homepage.href=https://travellerllm.i.lacy.ie"
      - "homepage.description=Mongoose Traveller 2e LLM Engine"
